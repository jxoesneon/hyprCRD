name: Publish to AUR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  aur-publish:
    name: Publish to Arch User Repository (AUR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Release Version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Check AUR Secrets
        id: check_secrets
        run: |
          if [ -z "${{ secrets.AUR_SSH_PRIVATE_KEY }}" ] || [ -z "${{ secrets.AUR_USERNAME }}" ]; then
            echo "Notice: AUR deployment credentials not configured in repository secrets."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish to AUR
        if: steps.check_secrets.outputs.configured == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: hyprcrd-git
          pkgbuild: packaging/aur/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to v${{ env.RELEASE_VERSION }}"

name: hyprCRD CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Quality Tools
        run: |
          pip install black flake8 mypy bandit

      - name: Python Format Check (black)
        run: |
          black --check bin/hyprcrd core/daemon.py test/unit_python/ scripts/

      - name: Python Lint Check (flake8)
        run: |
          flake8 bin/hyprcrd core/daemon.py test/unit_python/ scripts/ --count --max-line-length=140 --statistics

      - name: Python Type Check (mypy)
        run: |
          mypy bin/hyprcrd core/daemon.py scripts/check_hygiene.py --ignore-missing-imports

      - name: C/C++ Format Check (clang-format)
        run: |
          clang-format --dry-run --Werror \
            core/pam_shim.c \
            portal/src/*.cpp \
            portal/src/*.h \
            portal/test_virtual_input.cpp

      - name: Shell Script Lint (shellcheck)
        run: |
          shellcheck \
            scripts/*.sh \
            test/*.sh \
            bin/hyprcrd-enroll

  security-and-hygiene:
    name: Security & Repository Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Repository Hygiene Gate (Tracked Binaries & Secrets)
        run: |
          python3 scripts/check_hygiene.py

      - name: Python AST Security Audit (bandit)
        run: |
          pip install bandit
          bandit -r bin/hyprcrd core/daemon.py -s B108,B110,B404,B603,B607

      - name: Secret Leak Detection (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  build-and-test:
    name: Arch Linux Build & 100% Test Suite
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Update System & Install Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel \
            git \
            cmake \
            ninja \
            sdbus-c++ \
            libei \
            libxkbcommon \
            wayland \
            wayland-protocols \
            pipewire \
            python \
            python-psutil \
            uv \
            gdb

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Pre-build Portal & PAM Shim
        run: |
          # 1. Build C++20 Portal with compiler warnings treated as errors
          cmake -B portal/build -S portal -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build portal/build

          # 2. Build pam_shim.so
          gcc -shared -fPIC -O2 -Wall -Wextra core/pam_shim.c -o bin/pam_shim.so \
            $(pkg-config --cflags --libs gio-2.0 libpipewire-0.3 pam) -ldl

      - name: Run Master Test Suite & Coverage Verification
        run: |
          chmod +x test/run_all_tests.sh test/run_isolated_test.sh
          ./test/run_all_tests.sh

      - name: Enforce Coverage Thresholds
        run: |
          uv tool run --with psutil coverage report --fail-under=95

  aur-package-lint:
    name: AUR PKGBUILD Validation
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install Packaging Utilities
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm base-devel namcap git

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate PKGBUILD with namcap
        run: |
          cd packaging/aur
          namcap PKGBUILD

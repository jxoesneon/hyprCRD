name: Flatpak Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flatpak-build:
    name: Validate Flatpak Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Flatpak Tooling & Configure Flathub
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: hyprcrd.flatpak
          manifest-path: packaging/flatpak/org.hyprland.hyprcrd.yml
          run-tests: false

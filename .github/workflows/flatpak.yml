name: Flatpak Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flatpak-build:
    name: Validate Flatpak Build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: io.github.jxoesneon.hyprcrd.flatpak
          manifest-path: packaging/flatpak/io.github.jxoesneon.hyprcrd.yml
          run-tests: false

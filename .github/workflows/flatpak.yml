name: Flatpak Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flatpak-build:
    name: Validate Flatpak Build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: hyprcrd.flatpak
          manifest-path: packaging/flatpak/org.hyprland.hyprcrd.yml
          run-tests: false

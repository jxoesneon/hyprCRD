name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  ci:
    name: Lint and Test Gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Create GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Tag Matches Package Version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(grep -oP '__version__\s*=\s*"\K[^"]+' bin/hyprcrd | head -1)"
          if [ -z "$PKG_VERSION" ]; then
            echo "Error: could not read __version__ from bin/hyprcrd" >&2
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: tag v$TAG_VERSION does not match bin/hyprcrd __version__ $PKG_VERSION" >&2
            exit 1
          fi

      - name: Extract Changelog Section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Error: no CHANGELOG section found for [$VERSION]" >&2
            exit 1
          fi
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        run: |
          PRERELEASE=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" $PRERELEASE \
            --title "v${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
